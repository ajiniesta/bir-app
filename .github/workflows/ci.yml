name: CI

# En PRs y ramas solo se compila y se pasan los tests. En main, además, se
# publican las imágenes en GHCR y se valida el stack completo con Docker.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para publicar en GitHub Container Registry con GITHUB_TOKEN.
  packages: write

jobs:
  build-test:
    name: Compilar y testear
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Subir informes de tests si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            api/target/surefire-reports/
            web/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagen ${{ matrix.module }}
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR exige el nombre en minúsculas.
      - name: Calcular nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  smoke:
    name: Stack completo (docker compose)
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validar el compose
        run: docker compose -f docker-compose.full.yml config -q

      - name: Construir y levantar el stack
        run: docker compose -f docker-compose.full.yml up -d --build

      - name: Esperar a que respondan API y web
        run: |
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:18080/api/stats > /dev/null \
               && curl -fsS http://localhost:8081/ > /dev/null; then
              echo "Stack listo tras ${intento} intento(s)."
              exit 0
            fi
            sleep 3
          done
          echo "El stack no respondió a tiempo."
          exit 1

      - name: Comprobar estadísticas y login real
        run: |
          set -euo pipefail

          stats=$(curl -fsS http://localhost:18080/api/stats)
          echo "$stats"
          grep -q '"totalQuestions"' <<< "$stats"

          # Accept: text/html es imprescindible: Micronaut registra además el
          # /login JSON de micronaut-security y, sin negociación de contenido,
          # las dos rutas casan y responde 400 ("More than 1 route matched").
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Accept: text/html' \
            -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'username=admin&password=admin1234' \
            http://localhost:8081/login)
          test "$status" = "303"
          echo "Login correcto (303)."

      - name: Mostrar logs si algo falla
        if: failure()
        run: docker compose -f docker-compose.full.yml logs --no-color

      - name: Parar y borrar volúmenes
        if: always()
        run: docker compose -f docker-compose.full.yml down -v
