micronaut:
  application:
    name: bir-app-api
  server:
    port: 18080
  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:bir-app-dev-secret-change-me-in-production-0123456789}
      generator:
        access-token:
          expiration: 86400

datasources:
  default:
    url: jdbc:postgresql://localhost:5434/bir_app
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:bir_app}
    password: ${DB_PASSWORD:bir_app_secret}
    schema-generate: NONE

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
