micronaut:
  application:
    name: bir-app-api
  server:
    port: 8080

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/bir_app
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:bir_app}
    password: ${DB_PASSWORD:bir_app_secret}
    schema-generate: NONE

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
