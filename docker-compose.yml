
services:
  postgres:
    image: postgres:16-alpine
    container_name: bir-app-db
    environment:
      POSTGRES_DB: bir_app
      POSTGRES_USER: bir_app
      POSTGRES_PASSWORD: bir_app_secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bir_app -d bir_app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
