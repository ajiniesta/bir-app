micronaut:
  application:
    name: bir-app-web
  server:
    port: 8081
    max-request-size: 50MB
    netty:
      # El formulario de simulacros envía un campo questionIds por cada pregunta
      # seleccionada (hasta 210) más título, descripción y banco. El límite por
      # defecto de Netty es 128 campos y provoca un error de "tamaño" al guardar.
      form-max-fields: 512
    multipart:
      max-file-size: 50MB
  views:
    # Micronaut busca las vistas en classpath:/views por defecto; este proyecto
    # las tiene en templates/ (convención tipo Spring Boot).
    folder: templates
    thymeleaf:
      enabled: true
  http:
    client:
      # Las llamadas a la API se hacen por lotes (importación de 100 preguntas),
      # así que 10 s (valor por defecto) sobra; subirlo evita cortes puntuales en
      # servidores lentos sin volver a permitir peticiones eternas.
      read-timeout: 60s
  security:
    enabled: true
    # Autenticación basada en sesión (cookie). El token JWT que emite la API se
    # guarda como atributo de la autenticación y se reenvía en cada llamada.
    authentication: session
    redirect:
      login-success: /
      login-failure: /login?error
      logout: /login?logout
      unauthorized:
        enabled: true
        url: /login
      forbidden:
        enabled: true
        url: /login

api:
  # En local la API corre en el mismo host (18080); dentro de docker compose se
  # sobrescribe con API_BASE_URL (por ejemplo http://api:18080).
  base-url: ${API_BASE_URL:`http://localhost:18080`}
