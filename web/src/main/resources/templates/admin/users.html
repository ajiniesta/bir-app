<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración - BirApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">BirApp</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/}" class="btn btn-sm btn-outline-secondary">Inicio</a>
            <a th:href="@{/free}" class="btn btn-sm btn-primary">Modo libre</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="mb-4">
        <h1 class="h3 mb-1">Administración de usuarios</h1>
        <p class="text-muted mb-0">
            Asigna el rol de cada usuario y los bancos de preguntas a los que puede acceder.
            El acceso a bancos solo se aplica a los usuarios con rol <strong>USER</strong>.
        </p>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}">Guardado</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <div th:if="${users != null and #lists.isEmpty(users)}" class="alert alert-info">
        No hay usuarios registrados.
    </div>

    <div class="card mb-3" th:each="u : ${users}">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="fw-semibold" th:text="${u.displayName() != null ? u.displayName() : u.username()}">Nombre</span>
                    <span class="text-muted small" th:text="'@' + ${u.username()}">@usuario</span>
                </div>
                <span class="badge bg-secondary" th:text="${u.role()}">USER</span>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <form th:action="@{/admin/users/{id}/role(id=${u.id()})}" method="post">
                        <label class="form-label small text-uppercase text-muted">Rol</label>
                        <div class="input-group input-group-sm">
                            <select name="role" class="form-select">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                        th:selected="${r == u.role()}"></option>
                            </select>
                            <button type="submit" class="btn btn-outline-primary">Guardar</button>
                        </div>
                    </form>
                </div>

                <div class="col-lg-8">
                    <form th:action="@{/admin/users/{id}/banks(id=${u.id()})}" method="post">
                        <label class="form-label small text-uppercase text-muted">Bancos de preguntas</label>
                        <!-- Campo oculto para que el cuerpo del formulario nunca vaya vacío (si no hay ningún banco marcado). -->
                        <input type="hidden" name="banks" value="">
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check" th:each="et : ${examTypes}">
                                <input class="form-check-input" type="checkbox" name="banks"
                                       th:id="|bank-${u.id()}-${et.code()}|"
                                       th:value="${et.code()}"
                                       th:checked="${#lists.contains(u.allowedExamTypeCodes(), et.code())}">
                                <label class="form-check-label" th:for="|bank-${u.id()}-${et.code()}|"
                                       th:text="${et.code()} + ' - ' + ${et.name()}">MIR</label>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(examTypes)}" class="form-text">
                            No hay tipos de examen registrados.
                        </div>
                        <button type="submit" class="btn btn-sm btn-outline-primary mt-2">Guardar bancos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
