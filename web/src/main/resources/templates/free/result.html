<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resultado - BirApp')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-4" style="max-width: 720px">

    <h1 class="h4 mb-4">Resultado de la partida</h1>

    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Preguntas</div>
                    <div class="fs-2 fw-semibold" th:text="${session.totalQuestions()}">0</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Acertadas</div>
                    <div class="fs-2 fw-semibold text-success" th:text="${session.correctCount()}">0</div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Acierto</div>
                    <div class="fs-2 fw-semibold"
                         th:text="${(session.totalQuestions() > 0 ? (session.correctCount() * 100 / session.totalQuestions()) : 0)} + '%'">0%</div>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-2 text-muted small">
        <span th:if="${session.examTypeName() != null}">
            Tipo: <strong th:text="${session.examTypeName()}">MIR</strong>
        </span>
        <span th:if="${session.category() != null}" class="ms-2">
            Categoría: <strong th:text="${session.category()}">Cat</strong>
        </span>
        <span th:if="${session.tag() != null}" class="ms-2">
            Tag: <strong th:text="${session.tag()}">tag</strong>
        </span>
    </div>

    <div class="list-group mb-4">
        <div th:each="item : ${session.items()}" class="list-group-item">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <span>
                    <span th:text="'#' + ${item.position()} + '. ' + ${item.questionText()}">Pregunta</span>
                    <span th:if="${item.tag() != null}" class="badge bg-warning text-dark ms-1"
                          th:text="'#' + ${item.tag()}">#tag</span>
                </span>
                <span class="badge flex-shrink-0"
                      th:classappend="${item.correct()} ? 'bg-success' : 'bg-danger'"
                      th:text="${item.correct()} ? 'Correcta' : 'Incorrecta'">?</span>
            </div>
            <div class="small text-muted mt-1" th:if="${item.answered()}">
                Tu respuesta: <strong th:text="${item.selectedLetter()}">A</strong>
                · Correcta: <strong th:text="${item.correctLetter()}">B</strong>
            </div>
            <div class="mt-2 small" th:if="${item.explanation() != null and !#strings.isEmpty(item.explanation())}">
                <div class="fw-semibold">Explicación</div>
                <div style="white-space: pre-wrap" th:text="${item.explanation()}">Explicación...</div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/free}" class="btn btn-primary">Nueva partida</a>
        <a th:href="@{/}" class="btn btn-outline-secondary">Volver al panel</a>
    </div>
</div>
</body>
</html>
