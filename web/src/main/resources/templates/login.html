<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión - BirApp')}"></head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px">
    <div class="text-center mb-4">
        <h1 class="h3 mb-1">BirApp</h1>
        <p class="text-muted mb-0">Entra para practicar en modo libre</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}">OK</div>

    <form th:action="@{/login}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="text-center mt-3 mb-1">
        ¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a>
    </p>
    <p class="text-center small mb-0">
        <a th:href="@{/}">Volver al inicio</a>
    </p>
</div>
</body>
</html>
