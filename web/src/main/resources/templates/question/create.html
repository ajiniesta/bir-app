<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${question != null}">Editar Pregunta</title>
    <title th:unless="${question != null}">Nueva Pregunta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-4" th:if="${question != null}">Editar Pregunta</h1>
    <h1 class="h3 mb-4" th:unless="${question != null}">Nueva Pregunta</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <form th:action="${question != null} ? @{/questions/{id}/edit(id=${question.id()})} : @{/questions/create}"
          method="post" class="card p-4">

        <div class="mb-3">
            <label class="form-label">Tipo de examen</label>
            <select name="examTypeId" class="form-select" required>
                <option th:each="et : ${examTypes}" th:value="${et}"
                        th:text="${et}"
                        th:selected="${question != null && question.examTypeCode() == et}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" name="category" class="form-control"
                   th:value="${question != null} ? ${question.category()} : ''" placeholder="Opcional">
        </div>

        <div class="mb-3">
            <label class="form-label">Texto de la pregunta</label>
            <textarea name="text" class="form-control" rows="4" required
                      th:text="${question != null} ? ${question.text()} : ''">Pregunta...</textarea>
        </div>

        <hr>
        <h5>Opciones de respuesta</h5>
        <p class="text-muted small">Solo una opción debe ser la correcta.</p>

        <div th:each="i : ${#numbers.sequence(0, 3)}" class="row g-2 mb-2 align-items-center">
            <div class="col-auto">
                <span class="badge bg-secondary" th:text="${letters[i]}">A</span>
            </div>
            <div class="col">
                <input type="hidden" th:name="'answerOptions[' + ${i} + '].letter'" th:value="${letters[i]}">
                <input type="text" th:name="'answerOptions[' + ${i} + '].text'" class="form-control"
                       placeholder="Texto de la opción"
                       th:value="${question != null} ? ${question.answerOptions()[i].text()} : ''" required>
            </div>
            <div class="col-auto">
                <div class="form-check">
                    <input type="radio" th:name="'answerOptions[' + ${i} + '].isCorrect'"
                           th:id="'correct_' + ${letters[i]}"
                           class="form-check-input" value="true"
                           th:checked="${question != null && question.answerOptions()[i].isCorrect()}">
                    <label class="form-check-label" th:for="'correct_' + ${letters[i]}">Correcta</label>
                </div>
                <input type="hidden" th:name="'answerOptions[' + ${i} + '].isCorrect'" value="false">
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary" th:if="${question != null}">Guardar cambios</button>
            <button type="submit" class="btn btn-primary" th:unless="${question != null}">Crear pregunta</button>
            <a th:href="@{/questions}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
