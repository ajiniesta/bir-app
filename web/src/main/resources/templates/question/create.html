<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${form.editing()} ? 'Editar Pregunta' : 'Nueva Pregunta'">Nueva Pregunta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-4" th:text="${form.editing()} ? 'Editar Pregunta' : 'Nueva Pregunta'">Nueva Pregunta</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <form th:action="${form.editing()} ? @{/questions/{id}/edit(id=${form.id()})} : @{/questions/create}"
          method="post" class="card p-4">

        <div class="mb-3">
            <label class="form-label">Tipo de examen</label>
            <select name="examTypeId" class="form-select" required>
                <option value="">Selecciona un tipo de examen</option>
                <option th:each="et : ${examTypes}" th:value="${et.id()}"
                        th:text="${et.code() + ' - ' + et.name()}"
                        th:selected="${form.examTypeCode() != null and form.examTypeCode() == et.code()}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" name="category" class="form-control"
                   th:value="${form.category()}" placeholder="Opcional">
        </div>

        <div class="mb-3">
            <label class="form-label">Texto de la pregunta</label>
            <textarea name="text" class="form-control" rows="4" required
                      th:text="${form.text()}">Pregunta...</textarea>
        </div>

        <hr>
        <h5>Opciones de respuesta</h5>
        <p class="text-muted small">Solo una opción debe ser la correcta.</p>

        <div th:each="slot, it : ${form.slots()}" class="row g-2 mb-2 align-items-center">
            <div class="col-auto">
                <span class="badge bg-secondary" th:text="${slot.letter()}">A</span>
            </div>
            <div class="col">
                <input type="hidden" th:name="|answerOptions[${it.index}].letter|" th:value="${slot.letter()}">
                <input type="text" th:name="|answerOptions[${it.index}].text|" class="form-control"
                       placeholder="Texto de la opción"
                       th:value="${slot.text()}" required>
            </div>
            <div class="col-auto">
                <div class="form-check">
                    <input type="radio" name="correctLetter"
                           th:value="${slot.letter()}"
                           th:id="|correct_${slot.letter()}|"
                           class="form-check-input"
                           th:checked="${slot.correct()}" required>
                    <label class="form-check-label" th:for="|correct_${slot.letter()}|">Correcta</label>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary"
                    th:text="${form.editing()} ? 'Guardar cambios' : 'Crear pregunta'">Crear pregunta</button>
            <a th:href="@{/questions}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
