<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${question != null}" th:text="${'Pregunta #' + question.id()}">Pregunta</title>
    <title th:unless="${question != null}">No encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <div th:if="${question != null}">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4">Pregunta #<span th:text="${question.id()}">1</span></h1>
            <div>
                <a th:href="@{/questions/{id}/edit(id=${question.id()})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <a th:if="${canReview}" th:href="@{/revisiones}" class="btn btn-sm btn-outline-warning">Revisiones
                    <span th:if="${pendingProposals > 0}" class="badge bg-danger ms-1" th:text="${pendingProposals}">0</span></a>
                <a th:href="@{/questions}" class="btn btn-sm btn-outline-primary">Volver</a>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="mb-2">
                    <span class="badge bg-secondary" th:text="${question.examTypeCode()}">MIR</span>
                    <span th:if="${question.category()}" class="badge bg-info ms-1" th:text="${question.category()}">Cat</span>
                </div>
                <p class="card-text fs-5" th:text="${question.text()}">Texto de la pregunta...</p>
            </div>
        </div>

        <div class="card mb-3" th:if="${question.explanation() != null and !#strings.isEmpty(question.explanation())}">
            <div class="card-body">
                <div class="fw-semibold mb-1">Explicación</div>
                <div style="white-space: pre-wrap" th:text="${question.explanation()}">Explicación...</div>
            </div>
        </div>

        <h5>Opciones de respuesta</h5>
        <div class="list-group">
            <div th:each="opt : ${question.answerOptions()}"
                 class="list-group-item list-group-item-action d-flex align-items-center"
                 th:classappend="${opt.isCorrect()} ? 'list-group-item-success' : ''">
                <span class="badge bg-secondary me-2" th:text="${opt.letter()}">A</span>
                <span class="flex-grow-1" th:text="${opt.text()}">Texto...</span>
                <span th:if="${opt.isCorrect()}" class="badge bg-success ms-2">Correcta</span>
            </div>
        </div>

        <div class="mt-3 text-muted small">
            <span th:text="'Creado: ' + ${#temporals.format(question.createdAt(), 'dd/MM/yyyy HH:mm')}">Fecha</span>
            <span class="ms-3" th:text="'Modificado: ' + ${#temporals.format(question.updatedAt(), 'dd/MM/yyyy HH:mm')}">Fecha</span>
        </div>
    </div>

    <div th:if="${question == null and error == null}" class="alert alert-warning">Pregunta no encontrada.</div>
</div>
</body>
</html>
