<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Preguntas - BirApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Preguntas</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">Inicio</a>
            <a th:href="@{/simulacros}" class="btn btn-outline-primary">Simulacros</a>
            <a th:href="@{/free}" class="btn btn-outline-primary">Modo libre</a>
            <a th:href="@{/questions/create}" class="btn btn-primary">+ Nueva Pregunta</a>
        </div>
    </div>

    <form th:action="@{/questions}" method="get" class="row g-3 mb-4">
        <div class="col-auto">
            <select name="examType" class="form-select" th:value="${selectedExamType}">
                <option value="">Todos los tipos</option>
                <option th:each="et : ${examTypes}" th:value="${et.code()}" th:text="${et.code()}"
                        th:selected="${selectedExamType == et.code()}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(questions)}" class="alert alert-info">No hay preguntas disponibles.</div>

    <div th:each="q : ${questions}" class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <span class="badge bg-secondary mb-2" th:text="${q.examTypeCode()}">MIR</span>
                <span th:if="${q.category()}" class="text-muted small" th:text="${q.category()}">Cat</span>
            </div>
            <p class="card-text" th:text="${q.text()}">Pregunta...</p>
            <div class="d-flex gap-2">
                <a th:href="@{/questions/{id}(id=${q.id()})}" class="btn btn-sm btn-outline-primary">Ver</a>
                <a th:href="@{/questions/{id}/edit(id=${q.id()})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/questions/{id}/delete(id=${q.id()})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Eliminar esta pregunta?')">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
