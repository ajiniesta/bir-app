<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Preguntas - BirApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Preguntas</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">Inicio</a>
            <a th:href="@{/simulacros}" class="btn btn-outline-primary">Simulacros</a>
            <a th:href="@{/free}" class="btn btn-outline-primary">Modo libre</a>
            <a th:if="${canReview}" th:href="@{/revisiones}" class="btn btn-outline-warning">Revisiones
                <span th:if="${pendingProposals > 0}" class="badge bg-danger ms-1" th:text="${pendingProposals}">0</span></a>
            <a th:href="@{/questions/import}" class="btn btn-outline-success">Importar</a>
            <a th:href="@{/questions/duplicates}" class="btn btn-outline-warning">Duplicadas</a>
            <a th:href="@{/questions/create}" class="btn btn-primary">+ Nueva Pregunta</a>
        </div>
    </div>

    <form th:action="@{/questions}" method="get" class="card card-body mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-3">
                <label for="q" class="form-label small mb-1">Buscar en el enunciado</label>
                <input type="search" id="q" name="q" class="form-control" th:value="${searchText}"
                       placeholder="Texto de la pregunta...">
            </div>
            <div class="col-6 col-md-2">
                <label for="examType" class="form-label small mb-1">Banco</label>
                <select id="examType" name="examType" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="et : ${examTypes}" th:value="${et.code()}" th:text="${et.code()}"
                            th:selected="${selectedExamType == et.code()}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="category" class="form-label small mb-1">Categoría</label>
                <select id="category" name="category" class="form-select">
                    <option value="">Todas</option>
                    <option th:value="${noCategoryValue}" th:selected="${selectedCategory == noCategoryValue}">
                        Sin categoría
                    </option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                            th:selected="${selectedCategory == c}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="tag" class="form-label small mb-1">Tag</label>
                <select id="tag" name="tag" class="form-select">
                    <option value="">Todos</option>
                    <option th:value="${noTagValue}" th:selected="${selectedTag == noTagValue}">
                        Sin tag
                    </option>
                    <option th:each="t : ${tags}" th:value="${t}" th:text="${t}"
                            th:selected="${selectedTag == t}"></option>
                </select>
            </div>
            <div class="col-12 col-md-auto d-flex gap-2">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a th:href="@{/questions}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </div>
    </form>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${total > 0}" class="d-flex justify-content-between align-items-center mb-2">
        <small class="text-muted" th:text="|Mostrando ${from}–${to} de ${total} preguntas|">Mostrando 0–0 de 0</small>
        <small class="text-muted" th:text="|Página ${page} de ${totalPages}|">Página 1 de 1</small>
    </div>

    <div th:if="${error == null and #lists.isEmpty(questions)}" class="alert alert-info">
        <span th:if="${total == 0 and #strings.isEmpty(searchText) and #strings.isEmpty(selectedExamType) and #strings.isEmpty(selectedCategory) and #strings.isEmpty(selectedTag)}">
            No hay preguntas disponibles.
        </span>
        <span th:unless="${total == 0 and #strings.isEmpty(searchText) and #strings.isEmpty(selectedExamType) and #strings.isEmpty(selectedCategory) and #strings.isEmpty(selectedTag)}">
            No se encontraron preguntas con esos filtros.
        </span>
    </div>

    <div th:each="q : ${questions}" class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <span class="badge bg-secondary mb-2" th:text="${q.examTypeCode()}">MIR</span>
                <span class="text-end">
                    <span th:if="${q.category()}" class="text-muted small" th:text="${q.category()}">Cat</span>
                    <span th:if="${q.tag()}" class="badge bg-warning text-dark ms-1"
                          th:text="'#' + ${q.tag()}">#tag</span>
                </span>
            </div>
            <p class="card-text" th:text="${q.text()}">Pregunta...</p>
            <div class="d-flex gap-2">
                <a th:href="@{/questions/{id}(id=${q.id()})}" class="btn btn-sm btn-outline-primary">Ver</a>
                <a th:href="@{/questions/{id}/edit(id=${q.id()})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/questions/{id}/delete(id=${q.id()})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Eliminar esta pregunta?')">Eliminar</button>
                </form>
            </div>
        </div>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Paginación de preguntas" class="mt-4">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${page <= 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/questions(page=${page - 1}, q=${searchText}, examType=${selectedExamType}, category=${selectedCategory}, tag=${selectedTag})}">Anterior</a>
            </li>
            <li class="page-item" th:each="p : ${pageNumbers}" th:classappend="${p == page} ? 'active'">
                <a class="page-link"
                   th:href="@{/questions(page=${p}, q=${searchText}, examType=${selectedExamType}, category=${selectedCategory}, tag=${selectedTag})}"
                   th:text="${p}">1</a>
            </li>
            <li class="page-item" th:classappend="${page >= totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/questions(page=${page + 1}, q=${searchText}, examType=${selectedExamType}, category=${selectedCategory}, tag=${selectedTag})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
