<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta - BirApp')}"></head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px">
    <div class="text-center mb-4">
        <h1 class="h3 mb-1">Crear cuenta</h1>
        <p class="text-muted mb-0">Regístrate para guardar tus estadísticas</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <form th:action="@{/register}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="displayName">Nombre</label>
            <input type="text" id="displayName" name="displayName" class="form-control"
                   th:value="${displayName}" placeholder="Opcional">
        </div>
        <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control"
                   th:value="${username}" minlength="3" maxlength="50" required autofocus>
            <div class="form-text">Entre 3 y 50 caracteres.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control"
                   minlength="6" maxlength="100" required>
            <div class="form-text">Mínimo 6 caracteres.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
    </form>

    <p class="text-center mt-3 mb-1">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
    <p class="text-center small mb-0"><a th:href="@{/}">Volver al inicio</a></p>
</div>
</body>
</html>
