<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Simulacro en curso - BirApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">BirApp</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="text-muted small d-none d-md-inline" th:text="${attempt.mockExamTitle()}">Simulacro</span>
            <a th:if="${canReview}" th:href="@{/revisiones}" class="btn btn-sm btn-outline-warning">Revisiones
                <span th:if="${pendingProposals > 0}" class="badge bg-danger ms-1" th:text="${pendingProposals}">0</span></a>
            <a th:href="@{/simulacros/{id}(id=${mockExamId})}" class="btn btn-sm btn-outline-secondary">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 860px">

    <div th:if="${saved}" class="alert alert-success py-2">Respuesta guardada.</div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="'Pregunta ' + ${currentPosition} + ' de ' + ${attempt.totalQuestions()}">Pregunta 1</span>
        <span class="text-muted small"
              th:text="'Respondidas: ' + ${attempt.answeredCount()} + ' / ' + ${attempt.totalQuestions()}">0</span>
    </div>
    <div class="progress mb-4" style="height: 6px">
        <div class="progress-bar" role="progressbar"
             th:style="'width: ' + ${attempt.totalQuestions() > 0 ? (attempt.answeredCount() * 100 / attempt.totalQuestions()) : 0} + '%'"></div>
    </div>

    <!-- Navegador de preguntas -->
    <div class="d-flex flex-wrap gap-1 mb-4">
        <a th:each="item : ${attempt.items()}"
           th:href="@{/simulacros/{id}/attempts/{aid}(id=${mockExamId},aid=${attempt.id()},position=${item.position()})}"
           class="btn btn-sm"
           th:classappend="${item.position() == currentPosition} ? 'btn-dark' : (${item.answered()} ? 'btn-outline-success' : 'btn-outline-secondary')"
           th:text="${item.position()}">1</a>
    </div>

    <div class="card mb-3" th:if="${current != null}">
        <div class="card-body">
            <div class="mb-2">
                <span class="badge bg-secondary" th:text="${attempt.examTypeCode()}">MIR</span>
                <span class="badge bg-info ms-1" th:if="${current.category() != null}"
                      th:text="${current.category()}">Cat</span>
            </div>
            <p class="card-text fs-5 mb-0" th:text="${current.questionText()}">Enunciado</p>
        </div>
    </div>

    <form th:if="${current != null}"
          th:action="@{/simulacros/{id}/attempts/{aid}/answer(id=${mockExamId},aid=${attempt.id()})}"
          method="post">
        <input type="hidden" name="position" th:value="${current.position()}">

        <div class="list-group mb-3">
            <label th:each="opt : ${current.options()}"
                   class="list-group-item d-flex align-items-center" style="cursor: pointer">
                <input class="form-check-input me-3" type="radio" name="letter"
                       th:value="${opt.letter()}"
                       th:checked="${opt.letter() == current.selectedLetter()}">
                <span class="badge bg-secondary me-2" th:text="${opt.letter()}">A</span>
                <span th:text="${opt.text()}">Texto</span>
            </label>
        </div>

        <div class="d-flex flex-wrap gap-2">
            <button type="submit" name="action" value="save" class="btn btn-outline-primary">Guardar respuesta</button>
            <button type="submit" name="action" value="next" class="btn btn-primary">Guardar y siguiente</button>
        </div>
    </form>

    <div class="d-flex flex-wrap gap-2 mt-4">
        <a th:if="${currentPosition > 1}"
           th:href="@{/simulacros/{id}/attempts/{aid}(id=${mockExamId},aid=${attempt.id()},position=${currentPosition - 1})}"
           class="btn btn-outline-secondary">Anterior</a>
        <a th:if="${currentPosition < attempt.totalQuestions()}"
           th:href="@{/simulacros/{id}/attempts/{aid}(id=${mockExamId},aid=${attempt.id()},position=${currentPosition + 1})}"
           class="btn btn-outline-secondary">Siguiente</a>
        <form th:action="@{/simulacros/{id}/attempts/{aid}/finish(id=${mockExamId},aid=${attempt.id()})}"
              method="post" class="ms-auto">
            <button type="submit" class="btn btn-success"
                    onclick="return confirm('¿Entregar el simulacro? Ya no podrás cambiar tus respuestas.')">
                Entregar simulacro
            </button>
        </form>
    </div>
</div>
</body>
</html>
