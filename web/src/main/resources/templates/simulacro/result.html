<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado del simulacro - BirApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">BirApp</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/simulacros}" class="btn btn-sm btn-outline-secondary">Simulacros</a>
            <a th:href="@{/}" class="btn btn-sm btn-outline-secondary">Inicio</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 820px">
    <div th:if="${error}" class="alert alert-warning" th:text="${error}">Error</div>

    <div th:if="${attempt != null}">
        <div class="mb-4">
            <span class="badge bg-secondary mb-2" th:text="${attempt.examTypeCode()}">MIR</span>
            <h1 class="h3 mb-1" th:text="${attempt.mockExamTitle()}">Simulacro</h1>
            <p class="text-muted small mb-0"
               th:text="'Entregado el ' + ${#temporals.format(attempt.finishedAt(), 'dd/MM/yyyy HH:mm')}">Fecha</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small text-uppercase">Preguntas</div>
                        <div class="fs-2 fw-semibold" th:text="${attempt.totalQuestions()}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small text-uppercase">Acertadas</div>
                        <div class="fs-2 fw-semibold text-success" th:text="${attempt.correctCount()}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small text-uppercase">En blanco</div>
                        <div class="fs-2 fw-semibold text-secondary" th:text="${blankCount}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small text-uppercase">Nota</div>
                        <div class="fs-2 fw-semibold"
                             th:text="${#numbers.formatDecimal(attempt.accuracy(), 1, 1)} + '%'">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h5 mb-3">Revisión</h2>
        <div class="list-group mb-4">
            <div th:each="item : ${attempt.items()}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <span>
                        <span class="badge bg-secondary me-2" th:text="${item.position()}">1</span>
                        <span th:text="${item.questionText()}">Enunciado</span>
                    </span>
                    <span class="badge flex-shrink-0"
                          th:classappend="${!item.answered()} ? 'bg-secondary' : (${item.correct()} ? 'bg-success' : 'bg-danger')"
                          th:text="${!item.answered()} ? 'En blanco' : (${item.correct()} ? 'Correcta' : 'Incorrecta')">?</span>
                </div>

                <div class="mt-2">
                    <div th:each="opt : ${item.options()}"
                         th:with="isCorrect=${opt.letter() == item.correctLetter()}, isSelected=${opt.letter() == item.selectedLetter()}"
                         class="small py-1 px-2 rounded"
                         th:classappend="${isCorrect} ? 'bg-success-subtle' : (${isSelected} ? 'bg-danger-subtle' : '')">
                        <span class="badge bg-secondary me-2" th:text="${opt.letter()}">A</span>
                        <span th:text="${opt.text()}">Texto</span>
                        <span th:if="${isCorrect}" class="badge bg-success ms-2">Correcta</span>
                        <span th:if="${isSelected and !isCorrect}" class="badge bg-danger ms-2">Tu respuesta</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
            <form th:action="@{/simulacros/{id}/start(id=${mockExamId})}" method="post">
                <button type="submit" class="btn btn-primary">Repetir simulacro</button>
            </form>
            <a th:href="@{/simulacros/{id}(id=${mockExamId})}" class="btn btn-outline-secondary">Ver historial</a>
            <a th:href="@{/simulacros}" class="btn btn-outline-secondary">Todos los simulacros</a>
        </div>
    </div>
</div>
</body>
</html>
